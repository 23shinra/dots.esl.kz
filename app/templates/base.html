<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>{% block title %}dots — доставка по Алматы, которая не разоряет{% endblock %}</title>
    <meta name="description" content="dots — сеть точек-контейнеров по Алматы. Каждая точка — 100 ₸. Доставка в 2 раза дешевле Яндекса." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="grain"></div>

    <nav class="nav">
        <a href="#" class="nav__logo" aria-label="dots — на главную">
            <img src="{{ url_for('static', filename='img/logo-light.png') }}" alt="" class="nav__logo-img" />
            <span>dots</span>
        </a>
        <div class="nav__links">
            <a href="#problem">проблема</a>
            <a href="#how">как работает</a>
            <a href="#compare">сравнение</a>
        </div>
        <a href="#waitlist" class="nav__cta">ранний доступ</a>
    </nav>

    {% block content %}{% endblock %}

    <footer class="footer">
        <div class="footer__brand">
            <img src="{{ url_for('static', filename='img/logo-light.png') }}" alt="" class="nav__logo-img nav__logo-img--sm" />
            <span>dots — Алматы, 2026</span>
        </div>
        <div class="footer__links">
            <a href="mailto:hi@dots.kz">hi@dots.kz</a>
            <a href="#">instagram</a>
            <a href="#">telegram</a>
        </div>
        <div class="footer__attribution">
            карта: © Esri, Maxar, Earthstar Geographics
        </div>
    </footer>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
</body>
</html>
